$schema: ydk:schema:nfr
id: ydk:nfr:perf/run-time-100k
description: End-to-end run time at upper expected scale.
category: performance
target: <= 30 min for 100,000 file pairs, 8 workers, median decoded text <= 20,000 chars
measurement: wall_seconds in RunStats
test_method: 'Benchmark test (marked slow, not in default pytest run) on a generated corpus: 10,000 items
  x 10 files, 70% identical text, 30% edited, text sizes log-normal around median 20,000 chars with 1%
  of files at 500,000 chars; measured on an 8-core machine.'
applies_to:
- ydk:core-module:core/runner
- ydk:core-module:core/text-comparer
