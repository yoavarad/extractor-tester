$schema: ydk:schema:core-module
id: ydk:core-module:core/runner
description: 'Top-level run: config, discovery, worker processes, per-item timeout, results to writer
  and aggregator in item-id order, rendering.'
responsibility: Run orchestration and parallelism (ADR-006)
module_path: extractor_tester.runner
interface:
  run:
    description: Execute a compare run. Starts N worker processes fed one item at a time from a task queue;
      tracks which item each worker holds and since when. A worker past item_timeout_seconds is killed
      and replaced, its item recorded as item-timeout. A worker that dies is replaced, its item recorded
      as worker-crashed. Results are buffered and written in item-id order; dispatch runs at most workers
      x 32 items ahead of the oldest unfinished item, bounding the buffer. Always uses worker processes,
      also for --workers 1, so the timeout and crash handling always apply
    params:
      old: path
      new: path
      config_path: path
      out: path
      overwrite: boolean
      workers: integer
      profile: boolean
    returns:
      type: exit code
    raises:
    - ydk:tool-error:errors/worker-crashed
    - ydk:tool-error:errors/item-timeout
    - ydk:tool-error:errors/empty-input
    - ydk:tool-error:errors/internal-failure
depends_on:
- ydk:core-module:core/config-loader
- ydk:core-module:core/loader
- ydk:core-module:core/pair-comparer
- ydk:core-module:core/aggregator
- ydk:core-module:core/report-writer
- ydk:core-module:core/html-renderer
- ydk:core-module:core/timers
