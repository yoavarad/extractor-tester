$schema: ydk:schema:tool-error
id: ydk:tool-error:errors/worker-crashed
description: A worker process died (e.g. killed, out of memory).
code: WORKER_CRASHED
scope: item
severity: error
detail_template: 'item ${item_id}: worker process crashed'
triggers:
- process pool reports broken pool
behavior: Items whose results were not received are marked with this error; pool is recreated and the
  remaining items continue. After 3 restarts, every remaining item is marked with this error and the run
  finishes with a report.
related:
- ydk:core-module:core/runner
